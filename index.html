<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taxon Profiles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            letterSpacing: {
              tightest: '-0.04em',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* Slate 900 */
        color: #f1f5f9; /* Slate 100 */
        font-size: 16px;
        line-height: 1.6;
      }
      h1, h2, h3, .font-display {
        font-family: 'Outfit', sans-serif;
        letter-spacing: -0.02em;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      /* Enhanced Markdown Content Styling */
      .prose-custom {
        font-size: 1.0625rem; /* ~17px for better readability */
        color: #cbd5e1; /* Slate 300 */
      }
      .prose-custom p {
        margin-bottom: 1.25rem;
        line-height: 1.8;
      }
      .prose-custom p:last-child {
        margin-bottom: 0;
      }
      
      /* Internal bolding */
      .prose-custom strong {
        color: #f8fafc; /* Slate 50 */
        font-weight: 600;
      }
      
      /* Feature Labels (Habit, Leaves, etc.) */
      .prose-custom li > strong:first-child {
        color: #22d3ee; /* Cyan 400 */
        font-weight: 700;
        font-family: 'Outfit', sans-serif;
        letter-spacing: 0.01em;
      }

      .prose-custom em {
        font-style: italic;
        color: #94a3b8; /* slate-400 */
      }
      .prose-custom ul {
        list-style-type: none;
        margin-top: 1.25rem;
        margin-bottom: 1.25rem;
        padding-left: 0;
      }
      .prose-custom li {
        position: relative;
        padding-left: 1.75rem;
        margin-bottom: 1rem;
        line-height: 1.7;
      }
      .prose-custom li:last-child {
        margin-bottom: 0;
      }
      .prose-custom li::before {
        content: "";
        position: absolute;
        left: 0.25rem;
        top: 0.65rem;
        width: 0.375rem;
        height: 0.375rem;
        background-color: #22d3ee; /* cyan-400 */
        border-radius: 50%;
        opacity: 0.4;
      }
      .prose-custom h3 {
        font-family: 'Outfit', sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        color: #f1f5f9;
        margin-top: 2.5rem;
        margin-bottom: 1.25rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid rgba(34, 211, 238, 0.15);
        letter-spacing: -0.01em;
      }

      /* Comparison Table Styling */
      .comparison-table th.sticky-col,
      .comparison-table td.sticky-col {
        position: sticky;
        left: 0;
        z-index: 10;
        background-color: #0f172a;
        border-right: 1px solid rgba(51, 65, 85, 0.5);
      }
      
      .comparison-table th {
        background-color: #0f172a;
        z-index: 20;
      }

      .comparison-table tr:nth-child(even) {
        background-color: rgba(30, 41, 59, 0.4); /* Slate 800/40 */
      }

      /* Tooltip Styles */
      .tooltip-container {
        position: relative;
        display: inline-block;
      }
      .tooltip-text {
        visibility: hidden;
        width: 240px;
        background-color: #1e293b;
        color: #f1f5f9;
        text-align: left;
        border-radius: 8px;
        padding: 12px;
        position: absolute;
        z-index: 50;
        bottom: 125%;
        left: 50%;
        margin-left: -120px;
        opacity: 0;
        transition: opacity 0.3s;
        border: 1px solid #334155;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        font-size: 0.75rem;
        line-height: 1.4;
      }
      .tooltip-container:hover .tooltip-text {
        visibility: visible;
        opacity: 1;
      }

      /* Print Styles */
      @media print {
        *, *::before, *::after {
          background-color: transparent !important;
          background-image: none !important;
          color: black !important;
          box-shadow: none !important;
          text-shadow: none !important;
        }

        body {
          background-color: white !important;
          color: black !important;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        header button, 
        header input,
        .print\:hidden {
          display: none !important;
        }
        
        header {
          padding-top: 0 !important;
          padding-bottom: 20px !important;
          margin-bottom: 20px !important;
        }
        main {
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        
        .border, .border-slate-800, .border-slate-800\/50, .rounded-xl, .rounded-2xl {
          border: 1px solid #ccc !important;
          border-radius: 4px !important;
        }
        
        .text-cyan-400, .text-cyan-500, .text-slate-300, .text-slate-400, .text-slate-500, .text-orange-200, .text-orange-300 {
          color: black !important;
        }

        .prose-custom strong, .prose-custom li::before {
            color: black !important;
            font-weight: 700;
        }
        
        a {
          text-decoration: underline;
          color: black !important;
        }
        
        table, th, td {
          border: 1px solid #ccc !important;
        }
        
        h2, h3, .rounded-xl {
          page-break-inside: avoid;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
